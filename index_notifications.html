const { useState, useEffect } = React;

// === SMART STUDY REMINDERS: Notification + vibration ===
// Android IME safety: never open a modal, notification, or reminder while the
// user is editing any input/textarea/contenteditable field.
window.__shadowTyping = false;
window.__imeEditing = false;
window.__imeLastField = null;
window.__imeFocusUntil = 0;

function isEditableField(el){
  return !!(el && el.matches?.('input,textarea,select,[contenteditable="true"]'));
}
function shadowIsTyping(){
  const a=document.activeElement;
  return !!(window.__shadowTyping || window.__imeEditing || isEditableField(a));
}

// SAFE INPUT TRACKING ONLY — do not refocus, blur, or otherwise touch the
// active field. Android Chrome owns the IME/keyboard focus.
document.addEventListener("focusin", e => {
  if(!isEditableField(e.target)) return;
  window.__shadowTyping = true;
  window.__imeEditing = true;
  window.__imeLastField = e.target;
}, true);
document.addEventListener("focusout", e => {
  if(!isEditableField(e.target)) return;
  // IMPORTANT: never call focus() here. A focusout/focus() loop is known to
  // make Android Chrome dismiss the soft keyboard.
  setTimeout(() => {
    const a=document.activeElement;
    if(!isEditableField(a)) {
      window.__shadowTyping=false;
      window.__imeEditing=false;
      window.__imeLastField=null;
    }
  }, 250);
}, true);

// Block app vibration while the IME is active. This prevents Android from
// treating reminder vibration as an external interruption.
const __nativeVibrate = navigator.vibrate ? navigator.vibrate.bind(navigator) : null;
try {
  navigator.vibrate = function(pattern){
    if(window.__imeEditing || shadowIsTyping()) return true;
    return __nativeVibrate ? __nativeVibrate(pattern) : false;
  };
} catch(e) {}

// Never allow Notification() to be created while typing.
const __NativeNotification = window.Notification;
if(__NativeNotification){
  try {
    window.Notification = function(title, options){
      if(shadowIsTyping()) return { close(){} };
      return new __NativeNotification(title, options);
    };
    window.Notification.permission = __NativeNotification.permission;
    window.Notification.requestPermission = __NativeNotification.requestPermission.bind(__NativeNotification);
  } catch(e) {}
}
// Notifications work while this page/app is allowed to run JavaScript.
// On Android, vibration works when the browser/PWA permits it.
function reminderVibrate(pattern=[120,60,120]){
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(e) {}
}

function requestReminderPermission(){
  try{
    if (!("Notification" in window)) return;
    // IMPORTANT: never delay this request. A delayed permission prompt can
    // appear while the user is typing and Android Chrome may hide the keyboard.
    // Call this only from an explicit button tap (e.g. Analyze New Mock).
    if(Notification.permission === "default" && !localStorage.getItem("reminderPermissionAsked")){
      localStorage.setItem("reminderPermissionAsked","true");
      Notification.requestPermission().catch(()=>{});
    }
  }catch(e){}
}

function smartNotify(key,title,body,pattern=[120,60,120],force=false){
  try{
    // Never interrupt text entry. A browser notification/vibration while an
    // input is focused can make Android hide the soft keyboard.
    if(shadowIsTyping()) return false;

    // Also avoid anything that can steal focus during the Android IME transition.
    if(document.hasFocus && !document.hasFocus()) return false;

    const now=Date.now();
    const last=Number(localStorage.getItem("reminderSent_"+key)||0);
    // Prevent the same reminder from becoming spam.
    if(!force && now-last < 20*60*1000) return false;
    localStorage.setItem("reminderSent_"+key,String(now));
    reminderVibrate(pattern);
    if("Notification" in window && Notification.permission==="granted"){
      const n=new Notification(title,{
        body,
        tag:"shadow-study-"+key,
        renotify:true,
        silent:false
      });
      setTimeout(()=>{ try{ n.close(); }catch(e){} }, 10000);
      return true;
    }
  }catch(e){}
  return false;
}

function getSmartReminderSnapshot(){
  const today=localDateKey();
  let subtasks=[], analyses=[], contracts=[], tasks=[], punishments=[];
  try{subtasks=JSON.parse(localStorage.getItem(`studySubtasks_${today}`)||"[]")}catch(e){}
  try{analyses=JSON.parse(localStorage.getItem("mockAnalyses")||"[]")}catch(e){}
  try{contracts=JSON.parse(localStorage.getItem("shadowContracts")||"[]")}catch(e){}
  try{tasks=JSON.parse(localStorage.getItem("tasks")||"[]")}catch(e){}
  try{punishments=JSON.parse(localStorage.getItem("punishments")||"[]")}catch(e){}

  const dueRevisions=[];
  const weakMap={};
  analyses.forEach(a=>{
    (a.mistakes||[]).forEach(m=>{
      const key=`${m.section||"General"} — ${m.topic}`;
      weakMap[key]=(weakMap[key]||0)+1;
      (m.schedule||[]).forEach((r,i)=>{
        if(!r.done && r.date<=today) dueRevisions.push({topic:m.topic,section:m.section||"General",slot:i,date:r.date});
      });
    });
  });

  const weakTopics=Object.entries(weakMap)
    .filter(([,count])=>count>=2)
    .sort((a,b)=>b[1]-a[1]);

  const activeContracts=contracts.filter(c=>!c.done&&!c.failed);
  const contractNeedsProgress=activeContracts.filter(c=>{
    const dayIndex=Math.floor((Date.now()-Number(c.start||0))/(24*60*60*1000));
    return dayIndex>=0 && dayIndex<c.days && c.progress && c.progress[dayIndex]===false;
  });

  const pendingStudy=subtasks.filter(t=>!t.done);
  const pendingTasks=tasks.filter(t=>!t.completed&&!t.expired);
  const pendingPunishments=punishments.filter(p=>p && p.text);

  const studySec=(()=>{
    let total=0;
    try{
      const sessions=JSON.parse(localStorage.getItem("studySessions")||"[]");
      total=sessions.filter(s=>s.date===today).reduce((a,s)=>a+(Number(s.durationSec)||0),0);
    }catch(e){}
    total+=pendingStudy.reduce((a,t)=>a+(Number(t.elapsedSec)||0),0);
    return total;
  })();

  return {
    pendingStudy, dueRevisions, weakTopics, activeContracts,
    contractNeedsProgress, pendingTasks, pendingPunishments, studySec
  };
}

function runSmartReminders(reason="periodic"){
  const s=getSmartReminderSnapshot();
  const hour=new Date().getHours();

  // Highest priority: punishment/debt and revision queue.
  if(s.pendingPunishments.length){
    smartNotify(
      "punishments",
      "⚔️ Pending punishment",
      `${s.pendingPunishments.length} punishment task(s) pending. Clear them before adding more work.`,
      [180,70,180]
    );
  }

  if(s.dueRevisions.length){
    const names=[...new Set(s.dueRevisions.slice(0,3).map(x=>x.topic))].join(", ");
    smartNotify(
      "due-revisions",
      "🔥 Revision due",
      `${s.dueRevisions.length} revision(s) due. Start: ${names}.`,
      [150,60,150]
    );
  } else if(s.weakTopics.length){
    const names=s.weakTopics.slice(0,2).map(x=>x[0].split(" — ").pop()).join(", ");
    smartNotify(
      "weak-topics",
      "🚨 Weak topic alert",
      `Repeated mistakes detected. Revise: ${names}.`,
      [130,60,130]
    );
  }

  if(s.pendingStudy.length){
    const next=s.pendingStudy[0];
    smartNotify(
      "study-pending",
      "📚 Subject task pending",
      `${s.pendingStudy.length} study task(s) pending. Next: ${next.subjectName} • ${next.title}.`,
      [120,50,120]
    );
  }

  if(s.contractNeedsProgress.length){
    const c=s.contractNeedsProgress[0];
    smartNotify(
      "contract-progress-"+c.id,
      "🕯️ Forge Contract progress",
      `Today's progress is still pending for: "${c.goal}". Mark it complete before the day ends.`,
      [170,70,170]
    );
  }

  if(!s.activeContracts.length){
    smartNotify(
      "no-active-contract",
      "⚔️ Forge a new Contract",
      "No active Shadow Contract is running. Forge the next contract now.",
      [200,80,200]
    );
  }

  if(s.pendingTasks.length && reason==="periodic"){
    const titles=s.pendingTasks.slice(0,2).map(t=>t.title).join(" • ");
    smartNotify(
      "legacy-tasks",
      "⏳ Task pending",
      `${s.pendingTasks.length} task(s) still incomplete: ${titles}`,
      [110,50,110]
    );
  }

  // Keep the 7-hour study gate visible without spamming every check.
  if(s.studySec < DAILY_STUDY_TARGET_SEC && hour>=10){
    const remaining=Math.ceil((DAILY_STUDY_TARGET_SEC-s.studySec)/60);
    smartNotify(
      "study-gate",
      "🎯 7H study gate pending",
      `${remaining} min of study time still needed today.`,
      [100,50,100]
    );
  }
}

function getSubtaskElapsed(task){
  if(!task) return 0;
  if(task.done) return Number(task.targetSec)||0;
  if(activeSubtask?.taskId===task.id && activeSubtask.status==='running'){
    const elapsed=Math.floor((studyNow-activeSubtask.lastTickAt)/1000);
    return Math.min(Number(task.targetSec)||0, Number(activeSubtask.elapsedSec||0)+Math.max(0,elapsed));
  }
  return Number(task.elapsedSec||0);
}
function persistActiveStudySession(next){
  setActiveSubtask(next);

  else localStorage.removeItem('activeStudySubtask');

function startDailySubtask(taskId){
  if(activeSubtask) return;
  const task=dailySubtasks.find(t=>t.id===taskId);
  if(!task || task.done) return;
  const now=Date.now();
  const next={taskId:task.id,subjectId:task.subjectId,startAt:now,lastTickAt:now,elapsedSec:Number(task.elapsedSec||0),status:'running'};
  persistActiveStudySession(next);
  const updated=dailySubtasks.map(t=>t.id===task.id?{...t,status:'running',startedAt:t.startedAt||now}:t);
  saveDailySubtasks(updated);
  navigator.vibrate?.([70,40,70]);
}
function pauseDailySubtask(){
  if(!activeSubtask) return;
  const task=dailySubtasks.find(t=>t.id===activeSubtask.taskId);
  if(!task) { persistActiveStudySession(null); return; }
  const elapsed=Math.min(Number(task.targetSec)||0,getSubtaskElapsed(task));
  const updated=dailySubtasks.map(t=>t.id===task.id?{...t,elapsedSec:elapsed,status:elapsed>=t.targetSec?'done':'paused',done:elapsed>=t.targetSec}:t);
  saveDailySubtasks(updated);
  if(elapsed>=task.targetSec){ completeDailySubtask(task.id,elapsed); return; }
  persistActiveStudySession(null);
}
function completeDailySubtask(taskId,forcedElapsed=null){
  const task=dailySubtasks.find(t=>t.id===taskId);
  if(!task) return;
  if(activeSubtask?.taskId===taskId) persistActiveStudySession(null);
  const elapsed=Math.max(Number(task.elapsedSec||0),Number(forcedElapsed||0));
  const finishedAt=Date.now();
  const updated=dailySubtasks.map(t=>t.id===taskId?{...t,done:true,status:'done',elapsedSec:Math.min(t.targetSec,elapsed||t.targetSec),completedAt:finishedAt}:t);
  saveDailySubtasks(updated);
  const durationSec=Math.min(Number(task.targetSec)||0, Math.max(0,elapsed||Number(task.targetSec)||0));
  const session={id:`sess_${finishedAt}_${Math.random().toString(36).slice(2,7)}`,taskId:task.id,subjectId:task.subjectId,subjectName:task.subjectName,taskTitle:task.title,startAt:task.startedAt||task.createdAt,end:finishedAt,durationSec,date:studyDayKey};

function addDaysKey(dateKey, days){ const d=new Date(dateKey+"T12:00:00"); d.setDate(d.getDate()+days); return d.toISOString().split("T")[0]; }
function dueLabel(dateKey){
  const today=mockTodayKey();
  if(dateKey===today) return "Due today";
  const diff=Math.round((new Date(dateKey+"T12:00:00")-new Date(today+"T12:00:00"))/86400000);
  if(diff===1) return "Due tomorrow";
  if(diff>1) return `Due in ${diff}d`;
  return "Overdue";
}

function getAllMistakes(){ return mockAnalyses.flatMap(a=>a.mistakes.map(m=>({...m,analysisId:a.id,analysisDate:a.date,exam:a.exam}))); }
function getDueRevisions(){
  const today=mockTodayKey(); const rows=[];
  getAllMistakes().forEach(m=>m.schedule.forEach((r,i)=>{ if(!r.done && r.date<=today) rows.push({...m,slot:i,reviewDate:r.date}); }));
  return rows;
}
function getWeakTopics(){
  const map={};
  getAllMistakes().forEach(m=>{const key=`${m.section||"General"} — ${m.topic}`; if(!map[key]) map[key]={key,section:m.section||"General",topic:m.topic,count:0,reasons:{},lastDate:m.analysisDate}; map[key].count++; map[key].reasons[m.reason]=(map[key].reasons[m.reason]||0)+1; map[key].lastDate=m.analysisDate;});
  return Object.values(map).filter(x=>x.count>=2).sort((a,b)=>b.count-a.count);
}
function weakTopicScore(topicKey){
  const rows=getAllMistakes().filter(m=>`${m.section||"General"} — ${m.topic}`===topicKey);
  if(!rows.length) return 0;
  const repeats=rows.length;
  const recency=rows.reduce((sum,m)=>sum + (m.analysisDate===mockTodayKey()?1:0),0);
  return Math.min(100, 35 + repeats*12 + recency*8);
}
function getEffectiveFog(){
  const base=Number(fogLevel)||0;
  const due=getDueRevisions().length;
  const studySec=getTodayStudySecondsSafe();
  const deficit=Math.max(0, DAILY_STUDY_TARGET_SEC-studySec);
  const actionPenalty=Math.min(12, Math.max(0, Number(actionRuleStats?.missed||0)-Number(actionRuleStats?.success||0))*1.5);
  const revisionPenalty=Math.min(20, due*4);
  const studyPenalty=Math.min(18, (deficit/DAILY_STUDY_TARGET_SEC)*18);
  return Math.max(0, Math.min(100, Math.round(base+revisionPenalty+studyPenalty+actionPenalty)));
}

function accuracyFor(a){ if(a.attempted) return Math.round((a.correct/a.attempted)*100); return a.correct+a.wrong ? Math.round((a.correct/(a.correct+a.wrong))*100) : 0; }
function diagnosisFor(a){
  const acc=accuracyFor(a); const time=a.totalTime&&a.timeTaken ? (a.timeTaken/a.totalTime)*100 : null;
  const counts={}; (a.mistakes||[]).forEach(m=>counts[m.reason]=(counts[m.reason]||0)+1);
  const topReason=Object.entries(counts).sort((x,y)=>y[1]-x[1])[0];
  if(topReason && topReason[0]==="Time pressure") return "⏱️ Time management issue: practice timed sets and skip low-confidence questions earlier.";
  if(topReason && topReason[0]==="Silly mistake") return "🧠 Accuracy issue: slow down on the final calculation/read step and use a 5-second verification habit.";
  if(topReason && topReason[0]==="Formula/method") return "📐 Method issue: revise the formula/method, then solve 10–20 targeted questions without notes.";
  if(topReason && topReason[0]==="Guess") return "🎯 Guessing issue: mark doubtful questions and return only after confident attempts are secured.";
  if(topReason && topReason[0]==="Concept gap") return "📚 Concept gap: revise the topic today, then repeat it after 3 and 7 days.";
  if(acc<70) return "⚠️ Accuracy is low: prioritize error analysis before taking another full mock.";
  if(time!==null && time>100) return "⏱️ You are spending too long: build sectional timed practice before the next mock.";
  return "✅ Keep the current approach; focus the next revision on the repeated weak topics.";
}

const actionRuleTimeoutRef = React.useRef(null);
const actionRuleIntervalRef = React.useRef(null);

function clearActionRuleTimers() {
  if (actionRuleTimeoutRef.current) clearTimeout(actionRuleTimeoutRef.current);
  if (actionRuleIntervalRef.current) clearInterval(actionRuleIntervalRef.current);
  actionRuleTimeoutRef.current = null;
  actionRuleIntervalRef.current = null;
}

function finishActionRule(success) {
  clearActionRuleTimers();
  setActionRuleActive(false);
  setActionRulePhase("idle");
  setActionRuleCountdown(0);
  setActionWindowRemaining(30);
  setActionRuleCallback(null);

  setActionRuleStats(prev => {
    const next = {
      success: prev.success + (success ? 1 : 0),
      missed: prev.missed + (success ? 0 : 1),
    };
    localStorage.setItem("actionRuleSuccess", String(next.success));
    localStorage.setItem("actionRuleMissed", String(next.missed));
    return next;
  });
}

// Decision → random 2–5 sec countdown → 30 sec action window.
function triggerActionRule(title, action) {
  if (actionRuleActive || lockdown) return;

  clearActionRuleTimers();
  const seconds = Math.floor(Math.random() * 4) + 2;
  setActionRuleTitle(title || "ACT NOW");
  setActionRuleCountdown(seconds);
  setActionWindowRemaining(30);
  setActionRuleCallback(() => action?.());
  setActionRulePhase("countdown");
  setActionRuleActive(true);
  navigator.vibrate?.([80, 40, 80]);

  let remaining = seconds;
  actionRuleIntervalRef.current = setInterval(() => {
    remaining -= 1;
    setActionRuleCountdown(Math.max(remaining, 0));
  }, 1000);

  actionRuleTimeoutRef.current = setTimeout(() => {
    clearActionRuleTimers();
    setActionRulePhase("window");
    setActionWindowRemaining(30);
    navigator.vibrate?.([120, 50, 120]);

    let windowRemaining = 30;
    actionRuleIntervalRef.current = setInterval(() => {
      windowRemaining -= 1;
      setActionWindowRemaining(windowRemaining);
      if (windowRemaining <= 0) {
        clearActionRuleTimers();
        const missedText = `⚡ Action missed: ${title || "Task"} — 30 sec window expired.`;
        addPunishment({ type: "actionRuleMiss", text: missedText, deathMode: false });
        increaseDebt(3);
        finishActionRule(false);
      }
    }, 1000);
  }, seconds * 1000);
}

function confirmActionStarted() {
  if (!actionRuleActive || actionRulePhase !== "window") return;
  const callback = actionRuleCallback;
  finishActionRule(true);
  navigator.vibrate?.([60, 40, 60]);
  if (typeof callback === "function") callback();
}

// ---- Check Success ----
function checkChallengeComplete(challenge) {
  if (!challenge) return false;

  const now = Date.now();
  const oneDay = 24 * 60 * 60 * 1000;

  if (challenge.type === "streak") {
    const deadline = challenge.startDate + challenge.target * oneDay;
    if (now >= deadline) {
      return challenge.days.every((done) => done);
    }
  }

  if (challenge.type === "percentile") {
    return (
      challenge.logs.length > 0 &&
      challenge.logs.every((log) => log.passed === true)
    );
  }

  if (challenge.type === "tasks") {
    return challenge.progress >= challenge.target;
  }

  return false;
}

// ---- Check Fail ----
function checkChallengeFail(challenge) {
  if (!challenge) return false;

  const now = Date.now();
  const oneDay = 24 * 60 * 60 * 1000;

  if (challenge.type === "streak") {
    const deadline = challenge.startDate + challenge.target * oneDay;
    if (now >= deadline) {
      return !challenge.days.every((done) => done);
    }
  }

  if (challenge.type === "percentile") {
    const deadline = challenge.startDate + challenge.duration * oneDay;
    if (now >= deadline) {
      return !challenge.logs.every((log) => log.passed);
    }
  }

  if (challenge.type === "tasks") {
    const deadline = challenge.startDate + challenge.duration * oneDay;
    if (now >= deadline && challenge.progress < challenge.target) {
      return true;
    }
  }

  return false;
}

  function checkContractsForDayMissesAndExpire() {
    const now = Date.now();
    let updated = [...contracts];

      if (c.done || c.failed) return c;

      // Calculate day index
      const dayIndexNow = Math.floor((now - c.start) / (24 * 60 * 60 * 1000));
      const yesterdayIndex = dayIndexNow - 1;

      // ⚠️ Missed Yesterday Logging
      if (
        yesterdayIndex >= 0 &&
        c.progress[yesterdayIndex] === false &&
        !c.missNoted
      ) {
        setContractModalMessage(
          `⚠️ You missed logging progress for "${c.goal}" yesterday.\n\n🩸 Debt +5 | XP -3`
        );
        setShowContractModal(true);

        increaseDebt(5);
        setXP(prev => Math.max(0, prev - 3));
        smartNotify("contract-missed-"+c.id+"-"+yesterdayIndex,"⚠️ Contract progress missed",`You missed yesterday's progress for "${c.goal}". Fix the debt and continue.`,[220,80,220],true);

        c.missNoted = true;
        changed = true;
      }

      // ⚰️ Expiration Check
      if (now >= c.end) {
        const completedDays = c.progress.filter(Boolean).length;

        if (completedDays >= c.days) {
          // Completed Contract
          c = { ...c, done: true };

          setContractModalMessage(
            `✅ Contract Completed!\n\n"${c.goal}" has been successfully finished.\n+10 XP | Fog -20`
          );
          setShowContractModal(true);

          gainXP(10);

          });

          increaseDebt(10);

function getTodayStudySecondsSafe(){
  try {
    const today=localDateKey();
    const sessions=JSON.parse(localStorage.getItem('studySessions')||'[]');
    const completed=sessions.filter(x=>x.date===today).reduce((sum,x)=>sum+(Number(x.durationSec)||0),0);
    const active=JSON.parse(localStorage.getItem('activeStudySubtask')||'null');
    const subtasks=JSON.parse(localStorage.getItem(`studySubtasks_${today}`)||'[]');
    let running=0;
    if(active?.status==='running'){
      const task=subtasks.find(t=>t.id===active.taskId);
      if(task) running=Math.min(Number(task.targetSec)||0,Number(active.elapsedSec||0)+Math.max(0,Math.floor((Date.now()-Number(active.lastTickAt||Date.now()))/1000)));
    }
    const unfinished=subtasks.filter(t=>!t.done && t.id!==active?.taskId).reduce((sum,t)=>sum+(Number(t.elapsedSec)||0),0);
    return completed+running+unfinished;
  } catch(e){ return 0; }
}
function gainXP(amount) {
  const requested=Math.max(0,Number(amount)||0);

  const cap=studySec>=DAILY_STUDY_TARGET_SEC ? USER_DAILY_XP_CAP : PRE_7H_XP_CAP;
  const grant=Math.max(0,Math.min(requested,cap-state.earned));
  if(grant<=0) return 0;
  localStorage.setItem('dailyXPState',JSON.stringify({date:state.date,earned:state.earned+grant}));
  setXP(prev => {
    const next=prev+grant;
    localStorage.setItem('xp',String(next));
    return next;
  });
  return grant;
}

  function startProofTimeout(task) {
  // clear existing if any
  if (!task || !task.id) return;
  const id = task.id;

  // clear prior timeout if present
  if (proofTimeoutsRef.current[id]) {
    clearTimeout(proofTimeoutsRef.current[id]);
  }

  // schedule auto-fail after PROOF_GRACE_MS
  proofTimeoutsRef.current[id] = setTimeout(() => {

  }, PROOF_GRACE_MS);
}

function ensureProofTimeout(task) {
  // If timeout already exists in ref, leave it. Otherwise compute remaining time based on missedAt.
  if (!task || !task.id) return;
  const id = task.id;

  if (proofTimeoutsRef.current[id]) return; // already set

  const missedAt = task.missedAt || Date.now();
  const elapsed = Date.now() - missedAt;
  const remaining = Math.max(0, PROOF_GRACE_MS - elapsed);

  proofTimeoutsRef.current[id] = setTimeout(() => {
    handleProofTimeout(id);
  }, remaining);
}

function runArchitectDailyReport(testMode = false) {
  // ----- date keys -----
  const yesterdayDate = new Date();
  yesterdayDate.setDate(yesterdayDate.getDate() - 1);
  const yesterdayKey = yesterdayDate.toISOString().split("T")[0];
  const todayKey = new Date().toDateString();

  // stop if there is no history yet (first day)
  const history = JSON.parse(localStorage.getItem("history") || "[]");
  if (!Array.isArray(history) || history.length === 0) {
    console.log("Architect skipped: first day, no history yet.");
    return;
  }

  // check that yesterday actually exists in history
  const hasYesterday = history.some(h => h.date === yesterdayKey);
  if (!hasYesterday) {
    console.log("Architect skipped: no data for yesterday yet.");
    return;
  }
  // prevent duplicate runs in same day
  if (!testMode) {
    const last = localStorage.getItem("lastArchitectCheck");
    if (last === todayKey) return;
  }

  // ---------- load data ----------
  
  const prevDayData = history.find(h => h.date === yesterdayKey) || {};

  const xpToday =
    prevDayData.xpGainedToday ??
    (JSON.parse(localStorage.getItem("dailyXP") || "{}")[yesterdayKey] || 0);
  const fog =
    prevDayData.fogLevel ??
    parseInt(localStorage.getItem("fogLevel") || "0", 10);
  const dailyQuestDone = prevDayData.dailyQuestCompleted === true;
  const studyMinutesYesterday = Number(prevDayData.studyMinutes || 0);
  const study7hMet = studyMinutesYesterday >= (DAILY_STUDY_TARGET_SEC / 60);
  const healthQuestDone = prevDayData.healthQuestDone === true;
  const taskLogLocal = prevDayData.tasksCompleted || [];
  const relapse = !!prevDayData.relapseHua;

  // 🧠 Focus
  const focusStats = JSON.parse(localStorage.getItem("focusStats") || "[]");
  const yesterdayFocusCount = focusStats.filter(s => {
    if (!s.date) return false;
    const iso = new Date(s.date).toISOString().split("T")[0];
    return iso === yesterdayKey;
  }).length;

  // 🧠 Mock percentile improvement
  const mockHistory = JSON.parse(localStorage.getItem("mockHistory") || "[]");
  const yesterdayMocks = mockHistory.filter(m => m.date === yesterdayKey);
  const bestYesterday = yesterdayMocks.length
    ? Math.max(...yesterdayMocks.map(m => Number(m.percentile) || 0))
    : 0;
  const priorMocks = mockHistory.filter(m => m.date < yesterdayKey);
  const bestBefore = priorMocks.length
    ? Math.max(...priorMocks.map(m => Number(m.percentile) || 0))
    : 0;

  // 🕰 Wake-up
  const wakeLog = JSON.parse(localStorage.getItem("wakeUpLog") || "{}");
  const wokeUpOnTimeYesterday = !!wakeLog[yesterdayKey];

  // 💰 Debt
  const debtVal = parseInt(localStorage.getItem("debt") || "0", 10);

  // ---------- individual scores (0–100 each) ----------
  const scores = [
    { name: "Focus sessions", val: Math.min(100, (yesterdayFocusCount / 2) * 100) },
    { name: "7h study", val: Math.min(100, (studyMinutesYesterday / (DAILY_STUDY_TARGET_SEC / 60)) * 100) },
    { name: "Health quest", val: healthQuestDone ? 100 : 0 },
    { name: "XP gained", val: Math.min(100, (xpToday / USER_DAILY_XP_CAP) * 100) },
    { name: "Fog control", val: fog <= 70 ? 100 : Math.max(0, 100 - (fog - 70)) },
    { name: "Debt control", val: debtVal <= 15 ? 100 : Math.max(0, 100 - (debtVal - 15) * 5) },
    { name: "Wake-up on time", val: wokeUpOnTimeYesterday ? 100 : 0 },
    { name: "Mock improvement", val: bestYesterday > bestBefore ? 100 : 0 },
    { name: "Daily quest", val: dailyQuestDone ? 100 : 0 },
    { name: "Tasks done", val: taskLogLocal.length > 0 ? 100 : 0 },
    { name: "No relapse", val: !relapse ? 100 : 0 },
  ];

  let totalPercent =
    Math.round(scores.reduce((sum, s) => sum + s.val, 0) / scores.length);
  // Hard selection gate: a day below 7h study cannot receive a positive Architect verdict.
  if (!study7hMet) totalPercent = Math.min(totalPercent, 69);
  if (!healthQuestDone) totalPercent = Math.min(totalPercent, 74);

  // ---------- reward / punishment ----------
  if (totalPercent >= 80) {
    // ✅ reward path
    setArchitectPositiveStreak(prev => {
      const next = prev + 1;
      localStorage.setItem("architectPositiveStreak", String(next));
      return next;
    });
    setArchitectNegativeStreak(0);
    localStorage.setItem("architectNegativeStreak", "0");

    gainXP(5);
    setFogLevel(prev => Math.max(0, prev - 15));

    // 🎁 Architect Crystal reward
if (totalPercent >= 85) {
  addArchitectCrystal("Excellent discipline day", 5);
} else if (totalPercent >= 70) {
  addArchitectCrystal("Stable consistency day", 2);
  }
    const msg =
      `✅ Excellent Discipline!\nOverall Score: ${totalPercent}%\n` +
      `+5 XP, −15 Fog.`;
    showArchitectModal(msg, "positive");
  } else {
    // 💀 punishment path
    setArchitectNegativeStreak(prev => {
      const next = prev + 1;
      localStorage.setItem("architectNegativeStreak", String(next));
      return next;
    });
    setArchitectPositiveStreak(0);
    localStorage.setItem("architectPositiveStreak", "0");

    setXP(prev => {
      const next = Math.max(0, prev - 5);
      localStorage.setItem("xp", next);
      return next;
    });
    setFogLevel(prev => Math.min(100, prev + 15));
    setDebt(prev => {
      const next = (prev || 0) + 3;
      localStorage.setItem("debt", next);
      return next;
    });

    // pick a punishment
    const deathList =
      (Array.isArray(deathModePunishments) && deathModePunishments.length)
        ? deathModePunishments
        : (Array.isArray(punishments) ? punishments : []);
    const punishText = deathList.length
      ? deathList[Math.floor(Math.random() * deathList.length)]
      : "Do deep work for 2 hours";

    addPunishment({
      type: "architectPunish",
      text: `Architect's Judgment: ${punishText}`,
      deathMode: true,
    });

    const msg =
      `⚠️ Discipline Score: ${totalPercent}% (below 80%)\n` +
      `Punishment: ${punishText}\n🩸 +3 Debt, XP −5, Fog +15.`;
    showArchitectModal(msg, "negative");
  }

  applyDynamicThreshold();
  localStorage.setItem("lastArchitectCheck", todayKey);
  localStorage.setItem(
    "architectLastReport",
    JSON.stringify({ date: yesterdayKey, score: totalPercent })
  );
}

      {/* Daily Quest Modal */}
      {showDailyQuest && (

            {dailyQuestList.map((q,i)=>(
              <div key={i} className={`flex justify-between items-center gap-3 mb-2 text-sm rounded-xl p-2 ${q.required?'bg-gray-800/80 border border-gray-700':'bg-gray-950/60'}`}>

                <button disabled={q.done} onClick={()=>toggleQuestDone(i)} className={`px-3 py-1.5 rounded-lg font-bold ${q.done?"bg-green-600 text-white cursor-default":"bg-blue-600 hover:bg-blue-500 text-white"}`}>

{/* SELECTION MODE — hard daily gate */}
<div className="mt-6 p-4 bg-gradient-to-br from-gray-950 via-gray-900 to-red-950 rounded-3xl shadow-2xl max-w-md mx-auto border border-red-900/60">
  {(() => {
    const studySec=getTodayStudySecondsSafe();
    const studyPct=Math.min(100,Math.round((studySec/DAILY_STUDY_TARGET_SEC)*100));
    const healthDone=dailyQuestList.some(q=>q.category==='health' && q.done);
    const questDone=dailyQuestList.length>0 && dailyQuestList.filter(q=>q.required).every(q=>q.done) && dailyQuestList.some(q=>q.category==='health');
    const clear=studySec>=DAILY_STUDY_TARGET_SEC && healthDone && questDone;
    const xpState=getDailyXPState();
    const xpCap=studySec>=DAILY_STUDY_TARGET_SEC?USER_DAILY_XP_CAP:PRE_7H_XP_CAP;
    return <>
      <div className="flex items-center justify-between"><div><div className="text-[10px] uppercase tracking-[0.22em] text-red-400 font-black">SELECTION MODE</div><div className="text-xl font-black text-white">RRB + CGL Mission</div></div><div className={clear?"text-green-400 text-xs font-black":"text-red-400 text-xs font-black"}>{clear?"DAILY CLEAR":"NOT CLEARED"}</div></div>
      <div className="mt-4"><div className="flex justify-between text-sm"><span className="text-gray-300">📚 Study Gate</span><span className={studySec>=DAILY_STUDY_TARGET_SEC?"text-green-400 font-black":"text-yellow-400 font-black"}>{formatStudyDuration(studySec)} / 7h</span></div><div className="h-3 bg-gray-800 rounded-full overflow-hidden mt-2"><div className="h-full bg-gradient-to-r from-yellow-500 to-red-500 transition-all" style={{width:`${studyPct}%`}}/></div></div>
      <div className="grid grid-cols-2 gap-2 mt-3 text-xs"><div className={`rounded-xl p-3 border ${healthDone?'border-green-700 bg-green-950/30':'border-gray-700 bg-gray-900'}`}><div className="text-gray-400">🏃 Health Quest</div><div className="font-black mt-1">{healthDone?'DONE':'20 min required'}</div></div><div className={`rounded-xl p-3 border ${questDone?'border-green-700 bg-green-950/30':'border-gray-700 bg-gray-900'}`}><div className="text-gray-400">⚔️ Daily Quest</div><div className="font-black mt-1">{questDone?'DONE':'INCOMPLETE'}</div></div></div>
      <div className="mt-3 flex justify-between text-xs text-gray-400"><span>Daily XP cap</span><span className="font-black text-white">{xpState.earned} / {xpCap}{studySec<DAILY_STUDY_TARGET_SEC?' • 7h unlocks 70':''}</span></div>
      <div className="mt-2 text-[11px] text-gray-500">XP farming is capped. Before 7h, max 35 XP/day. After 7h, max 70 XP/day — matching the rival's daily pace.</div>
    </>;
  })()}
</div>

{/* YPT-STYLE STUDY TRACKER — persistent subjects, daily subtasks */}
<div className="mt-6 p-4 bg-gray-950 rounded-3xl shadow-2xl max-w-md mx-auto border border-gray-800">

      <p className="text-xs text-gray-500 mt-1">Subjects stay. Subtasks reset every day.</p>

  </div>

  <div className="rounded-2xl bg-gray-900 border border-gray-800 p-4 mb-4">
    <div className="flex items-end justify-between">
      <div><div className="text-xs text-gray-500 uppercase tracking-widest">Today</div><div className="text-3xl font-black text-white tabular-nums mt-1">{formatStudyDuration(getTodayStudySeconds())}</div></div>
      <div className="text-right"><div className="text-xs text-gray-500">{dailySubtasks.filter(t=>t.done).length}/{dailySubtasks.length} tasks</div><div className="text-sm font-bold text-gray-300">{studySubjects.length} subjects</div></div>
    </div>
  </div>

  {activeSubtask && (()=>{
    const task=dailySubtasks.find(t=>t.id===activeSubtask.taskId);

    return <div className="mb-4 rounded-2xl border border-green-500/50 bg-green-950/40 p-4">
      <div className="text-[10px] uppercase tracking-[0.2em] text-green-300">Currently studying</div>
      <div className="font-black text-lg text-white mt-1">{task.subjectName} • {task.title}</div>
      <div className="text-3xl font-black text-green-400 tabular-nums mt-2">{formatStudyClock(remaining)}</div>
      <div className="text-xs text-gray-400 mt-1">Started {formatStudyTime(activeSubtask.startAt)} • {formatStudyDuration(elapsed)} completed</div>
      <div className="flex gap-2 mt-3">
        <button onClick={pauseDailySubtask} className="flex-1 py-3 rounded-xl bg-yellow-500 hover:bg-yellow-400 text-black font-black active:scale-95">Ⅱ PAUSE</button>
        <button onClick={()=>completeDailySubtask(task.id,elapsed)} className="flex-1 py-3 rounded-xl bg-green-500 hover:bg-green-400 text-black font-black active:scale-95">✓ DONE</button>
      </div>
    </div>;
  })()}

  {studySubjects.length===0 ? <div className="text-center py-9 text-gray-400"><div className="text-4xl">📖</div><p className="font-bold text-white mt-2">No subjects yet</p><p className="text-sm mt-1">Maths, English, Computer etc. add karo.</p>{tasks.length>0 && <button onClick={importLegacyTasksAsSubjects} className="mt-4 px-4 py-2 rounded-xl bg-gray-800 text-sm font-bold">↗ Import old tasks</button>}</div> :
  <div className="space-y-3">
    {studySubjects.map((subject,i)=>{
      const subjectTasks=dailySubtasks.filter(t=>t.subjectId===subject.id);
      const studied=getSubjectTodaySeconds(subject.id);
      return <div key={subject.id} className="rounded-2xl bg-gray-900 border border-gray-800 overflow-hidden animate-fadeIn" style={{animationDelay:`${i*0.04}s`}}>
        <div className="p-4 flex items-center justify-between gap-2">
          <div className="flex items-center gap-2 min-w-0"><span className="w-3 h-8 rounded-full shrink-0" style={{backgroundColor:subject.color}}></span><div><div className="font-black text-white text-lg truncate">{subject.name}</div><div className="text-xs text-gray-500">Today: {formatStudyDuration(studied)} • {subjectTasks.length} tasks</div></div></div>
          <div className="flex gap-1 shrink-0">
            <button disabled={!!activeSubtask||lockdown} onClick={()=>{setSelectedSubjectId(subject.id);setShowSubtaskModal(true)}} className="w-9 h-9 rounded-xl bg-gray-800 hover:bg-gray-700 text-xl font-bold disabled:opacity-40">＋</button>
            {!lockdown && <button onClick={()=>deleteStudySubject(subject.id)} className="w-9 h-9 rounded-xl bg-gray-800 text-gray-500 hover:text-red-400">⋮</button>}
          </div>
        </div>
        <div className="px-4 pb-4 space-y-2">
          {subjectTasks.length===0 && <div className="text-xs text-gray-600 pl-5">No task for today. ＋ add one.</div>}

            const elapsed=getSubtaskElapsed(task); const progress=Math.min(100,Math.round(elapsed/task.targetSec*100)); const paused=task.status==='paused';
            return <div key={task.id} className={`rounded-xl p-3 border ${task.done?'border-green-900 bg-green-950/20':'border-gray-800 bg-gray-950/70'}`}>
              <div className="flex items-start gap-3">
                <div className={`mt-1 w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 ${task.done?'border-green-500 bg-green-500 text-black':'border-gray-600'}`}>{task.done?'✓':''}</div>
                <div className="min-w-0 flex-1">
                  <div className={`font-bold ${task.done?'text-gray-500 line-through':'text-gray-200'}`}>{task.title}</div>
                  <div className="text-xs text-gray-500 mt-1">{task.done ? `Completed • ${formatStudyTime(task.completedAt)}` : `${formatStudyDuration(elapsed)} / ${formatStudyDuration(task.targetSec)}${paused?' • Paused':''}`}</div>
                  {!task.done && <div className="mt-2 h-1.5 rounded-full bg-gray-800 overflow-hidden"><div className="h-full rounded-full bg-blue-500 transition-all" style={{width:`${progress}%`}}></div></div>}
                  {!task.done && <div className="text-[11px] text-gray-600 mt-1">{task.startedAt?`Started ${formatStudyTime(task.startedAt)}`:'Not started'}</div>}
                </div>
                <div className="flex flex-col gap-1 shrink-0">
                  {!task.done && !activeSubtask && <button onClick={()=>triggerActionRule(`Study • ${subject.name} • ${task.title}`,()=>startDailySubtask(task.id))} className="px-3 py-1.5 rounded-lg bg-blue-500 text-white font-black text-xs">{paused?'RESUME':'START'}</button>}
                  {!task.done && activeSubtask?.taskId===task.id && <span className="px-2 py-1 text-[10px] rounded-lg bg-green-900 text-green-300 font-black">RUNNING</span>}
                  {!task.done && <button disabled={!!activeSubtask&&activeSubtask.taskId!==task.id} onClick={()=>completeDailySubtask(task.id,getSubtaskElapsed(task))} className="px-3 py-1.5 rounded-lg bg-gray-800 text-gray-300 font-bold text-xs disabled:opacity-30">DONE</button>}
                  {!task.done && !activeSubtask && <button onClick={()=>deleteDailySubtask(task.id)} className="text-[10px] text-gray-600 hover:text-red-400">Delete</button>}
                </div>
              </div>
            </div>;
          })}
        </div>
      </div>;
    })}
  </div>}

  {studySessions.length>0 && <div className="mt-5 pt-4 border-t border-gray-800"><div className="text-sm font-bold text-gray-300 mb-2">Recent study sessions</div><div className="space-y-2 max-h-40 overflow-y-auto">{[...studySessions].reverse().slice(0,7).map(x=><div key={x.id} className="flex justify-between items-center text-xs bg-gray-900 rounded-xl px-3 py-2"><span className="text-gray-300 truncate mr-2">{x.subjectName} • {x.taskTitle}</span><span className="text-gray-500 shrink-0">{formatStudyDuration(x.durationSec)} • {x.date}</span></div>)}</div></div>}
</div>

{/* Add Subject Modal */}
{showSubjectModal && <div className="fixed inset-0 z-[90] flex items-center justify-center p-4"><div className="absolute inset-0 bg-black/80" onClick={()=>setShowSubjectModal(false)}></div><div className="relative w-full max-w-sm bg-gray-900 rounded-3xl p-5 border border-blue-500/30 shadow-2xl"><div className="flex justify-between items-center mb-4"><h2 className="text-xl font-black text-white">Add Subject</h2><button onClick={()=>setShowSubjectModal(false)} className="text-gray-500">✕</button></div><input autoFocus value={newSubjectName} onChange={e=>setNewSubjectName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addStudySubject()} placeholder="Maths / English / Computer" className="w-full p-3 rounded-xl bg-gray-800 text-white border border-gray-700 outline-none focus:border-blue-500"/><div className="text-xs text-gray-500 mt-3 mb-2">Subject color</div><div className="flex gap-2 flex-wrap mb-4">{['#f59e0b','#fb7185','#60a5fa','#34d399','#a78bfa','#22d3ee','#f97316'].map(c=><button key={c} onClick={()=>setNewSubjectColor(c)} className="w-8 h-8 rounded-full border-2" style={{backgroundColor:c,borderColor:newSubjectColor===c?'white':'transparent'}}></button>)}</div><button onClick={addStudySubject} className="w-full py-3 rounded-xl bg-blue-500 text-white font-black">ADD SUBJECT</button></div></div>}

{/* Add Daily Subtask Modal */}
{showSubtaskModal && <div className="fixed inset-0 z-[90] flex items-center justify-center p-4"><div className="absolute inset-0 bg-black/80" onClick={()=>setShowSubtaskModal(false)}></div><div className="relative w-full max-w-sm bg-gray-900 rounded-3xl p-5 border border-green-500/30 shadow-2xl"><div className="text-xs uppercase tracking-widest text-green-400 font-black">{studySubjects.find(s=>s.id===selectedSubjectId)?.name || 'Subject'}</div><h2 className="text-xl font-black text-white mt-1 mb-4">Add today's task</h2><input autoFocus value={newSubtaskTitle} onChange={e=>setNewSubtaskTitle(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addDailySubtask()} placeholder="Trigonometry / Algebra / MCQ" className="w-full p-3 rounded-xl bg-gray-800 text-white border border-gray-700 outline-none focus:border-green-500"/><label className="block text-xs text-gray-500 mt-3 mb-1">Duration (minutes)</label><input type="number" min="1" max="1440" value={newSubtaskMinutes} onChange={e=>setNewSubtaskMinutes(e.target.value)} className="w-full p-3 rounded-xl bg-gray-800 text-white border border-gray-700 outline-none focus:border-green-500"/><button onClick={addDailySubtask} className="w-full mt-4 py-3 rounded-xl bg-green-500 text-black font-black">ADD TASK • {newSubtaskMinutes || 0} MIN</button></div></div>}

{/* ⚡ DECISION → ACTION SYSTEM */}
{actionRuleActive && (
  <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/95 backdrop-blur-md p-5">
    <div className="w-full max-w-md text-center border border-red-500/50 rounded-3xl p-7 bg-gray-950 shadow-2xl">
      <div className="text-yellow-400 text-xs font-black tracking-[0.28em] mb-3">⚡ DECISION LOCKED</div>
      <h2 className="text-3xl sm:text-4xl font-black mb-3 break-words">{actionRuleTitle}</h2>

      {actionRulePhase === "countdown" ? (
        <>
          <p className="text-gray-300 mb-5">Ab negotiation nahi. Bas move karo.</p>
          <div className="text-7xl font-black text-red-400 mb-4 tabular-nums">{actionRuleCountdown}</div>
          <div className="text-xs text-gray-500">Random 2–5 sec. Get ready.</div>

      ) : (
        <>
          <p className="text-green-300 font-bold mb-4">🚨 ACTION WINDOW — START NOW</p>

            I'M MOVING — START ✓
          </button>
          <div className="text-xs text-gray-500 mt-3">30 sec ke andar action physically start karke button dabao.</div>
        </>
      )}

      <div className="mt-6 pt-4 border-t border-gray-800 text-xs text-gray-500">
        Action streak: <span className="text-green-400 font-bold">{actionRuleStats.success}</span> successful · Missed: <span className="text-red-400 font-bold">{actionRuleStats.missed}</span>
      </div>
    </div>
  </div>
)}

<div className="daily-reflection-card">

<div className="chat-box">
  <textarea
    className="chat-input"
    placeholder="Write your question…"

    onChange={(e) => {
      setDailyQuestion(e.target.value);

<div className="chat-box">

    placeholder="Write your answer…"

  <button

      <HistoryCalendar

/>
{selectedHistoryDay && (

        className="absolute top-2 right-2 text-gray-400 hover:text-white"

      <p>
        <strong>Daily Quest:</strong>{" "}
        {selectedHistoryDay.dailyQuestCompleted ? "✅ Completed" : "❌ Failed"}
      </p>
      
      <p>
  <strong>Wake Up:</strong>{" "}

</p>
<p>
  <strong>Mock Percentile:</strong> {selectedHistoryDay.mockPercentile || 0}%
</p>
       <div className="mt-3">
    <h4 className="font-semibold">✅ Tasks Completed:</h4>
    <ul className="list-disc list-inside text-sm">
      {selectedHistoryDay.tasksCompleted.map((t, idx) => (
        <li key={idx}>{t}</li>
      ))}
    </ul>
  </div>

    </div>
  </div>
)}
      
    </div>   
  );         
}
